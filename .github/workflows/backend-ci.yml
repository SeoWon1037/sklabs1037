# ============================================
# 백엔드 CI
# backend 폴더 코드가 바뀌면,
# GitHub이 빌려준 가상 컴퓨터에서 자동으로 "컴파일 + 테스트"를 실행
# ============================================

# 이 CI의 이름 (Actions 탭에 이렇게 보임)
name: Backend CI

# ─────────────────────────────────────────────
# ① 언제 실행할까? (프론트와 구조 동일, 폴더만 backend)
# 아래 두 상황(push, PR) 중 하나라도 생기면 실행
# ─────────────────────────────────────────────
on:

  # [상황 1] 누군가 push 했을 때
  push:
    # 조건 1: main 브랜치에 push한 경우만
    branches: [main]
    # 조건 2: 아래 파일 중 하나라도 바뀐 경우만
    #  → 조건 1, 2를 둘 다 만족해야 실행됨 (프론트만 고치면 안 돎)
    paths:
      - 'backend/**'                          # backend 폴더 안 아무 파일이나
      - '.github/workflows/backend-ci.yml'    # 또는 이 CI 파일 자체

  # [상황 2] 누군가 "main에 합쳐주세요" PR을 만들었을 때 (합치기 전 검사)
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# ─────────────────────────────────────────────
# ② 여기부터 "실제로 할 일"
# ─────────────────────────────────────────────
jobs:

  # 작업 이름 (원하는 대로 지어도 됨)
  build:

    # GitHub에서 빌려올 컴퓨터 종류
    # 매번 새 리눅스 컴퓨터가 주어지고, 끝나면 삭제됨
    runs-on: ubuntu-latest

    # 아래 run 명령어들은 전부 backend 폴더에서 실행
    # (gradlew, build.gradle이 backend 안에 있으니까 = 자동 cd backend)
    defaults:
      run:
        working-directory: backend

    # ─────────────────────────────────────────
    # ③ 준비물: 테스트용 임시 DB  ★ 프론트엔 없는 부분
    #
    # 왜 필요하냐면?
    #  Spring Boot 기본 테스트(contextLoads)는 "서버가 정상적으로 켜지나?"를 확인하는데,
    #  서버가 켜질 때 application.properties대로 DB 연결을 시도함
    #  → DB가 없으면 테스트 실패 ❌
    #
    # 왜 운영 RDS를 안 쓰냐면?
    #  - RDS 비밀번호를 GitHub에 넘겨야 함 (보안 위험)
    #  - 테스트가 운영 데이터를 건드릴 수 있음
    #  → 그래서 CI 컴퓨터 안에 "버려도 되는 DB"를 잠깐 띄움
    # ─────────────────────────────────────────
    services:

      # 띄울 보조 서버 이름
      postgres:

        # Docker 이미지 = "PostgreSQL 16이 설치된 상태"를 통째로 저장해둔 틀
        # 이걸로 PostgreSQL을 설치 과정 없이 바로 실행함
        image: postgres:16

        # 임시 DB를 만들 때 쓸 설정값
        # (CI에서만 잠깐 쓰고 사라지는 DB라 비밀번호가 공개돼도 상관없음)
        env:
          POSTGRES_USER: postgres       # 관리자 아이디
          POSTGRES_PASSWORD: postgres   # 관리자 비밀번호
          POSTGRES_DB: sklabs_test      # 처음 만들어둘 DB 이름

        # 연결 통로
        # "DB의 5432번 문"을 "CI 컴퓨터의 5432번 문"에 연결
        # → Spring Boot가 localhost:5432로 접속하면 이 DB로 연결됨
        ports:
          - 5432:5432

        # DB가 "완전히 켜질 때까지" 기다리는 설정
        # DB는 켜지는 데 몇 초 걸리는데, 그 전에 테스트가 시작되면 연결 실패함
        #  --health-cmd pg_isready : "DB 준비됐어?" 확인하는 명령어
        #  --health-interval 10s   : 10초마다 확인
        #  --health-timeout 5s     : 한 번 확인할 때 5초 안에 대답 없으면 실패로 침
        #  --health-retries 5      : 최대 5번까지 다시 확인
        # (주의: 아래 4줄 사이엔 주석을 넣으면 안 됨, >- 가 줄들을 한 줄로 이어붙이기 때문)
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # ─────────────────────────────────────────
    # ④ 환경변수  ★ 프론트엔 없는 부분
    #
    # application.properties에 이렇게 써뒀었지?
    #   spring.datasource.url=${DB_URL}
    #   spring.datasource.username=${DB_USERNAME}
    #   spring.datasource.password=${DB_PASSWORD}
    #
    # ${...} 자리에 들어갈 값을 환경마다 다른 곳에서 넣어줌
    #   - 로컬(내 PC) : IntelliJ 실행 설정 → 운영 RDS
    #   - CI          : 바로 여기 → 위에서 띄운 임시 DB
    # → 코드(application.properties)는 한 글자도 안 바꿔도 됨!
    # ─────────────────────────────────────────
    env:
      DB_URL: jdbc:postgresql://localhost:5432/sklabs_test   # 위 임시 DB 주소
      DB_USERNAME: postgres                                  # 위 POSTGRES_USER와 같게
      DB_PASSWORD: postgres                                  # 위 POSTGRES_PASSWORD와 같게

    # ─────────────────────────────────────────
    # ⑤ 할 일 목록 (위에서부터 순서대로, 하나라도 실패하면 멈추고 ❌)
    # uses: 남이 만든 기능 가져다 쓰기 / run: 터미널 명령어 직접 실행
    # ─────────────────────────────────────────
    steps:

      # [1번] 코드 받아오기
      # 새 컴퓨터는 텅 비어 있으니, push된 그 커밋의 코드를 통째로 내려받음
      - name: 코드 받아오기
        uses: actions/checkout@v4

      # [2번] Java 설치  (프론트의 "Node.js 설치"에 해당)
      # Spring Boot는 Java로 만들었으니 Java가 있어야 컴파일 가능
      - name: JDK 설치
        uses: actions/setup-java@v4       # GitHub 공식 "Java 설치" 기능
        with:
          # JDK는 여러 회사가 만들어서 배포함 (Oracle, Amazon, Eclipse...)
          # temurin = Eclipse 재단의 무료 JDK, 가장 많이 쓰임
          distribution: temurin
          # build.gradle의 JavaLanguageVersion.of(17)과 반드시 같게
          java-version: '17'

      # [3번] Gradle 준비  (프론트의 "cache: npm"에 해당)
      # Gradle = Java 프로젝트의 빌드 도구 (npm 같은 역할)
      # 다운받은 라이브러리(Spring, JPA, PostgreSQL 드라이버...)를 GitHub에 보관해뒀다가
      # 다음 CI 때 재사용 → 첫 실행은 느리고, 두 번째부터 빨라짐
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # [4번] gradlew 실행 권한 주기
      # gradlew = "Gradle 설치 없이도 정해진 버전의 Gradle을 실행해주는 파일"
      #           (backend 폴더 안에 이미 들어 있음)
      # 리눅스는 파일마다 "실행해도 됨" 표시(권한)가 있어야 실행 가능한데,
      # Windows에서 커밋하면 이 표시가 빠지는 경우가 많음 → "Permission denied" 에러
      # chmod +x = "이 파일 실행해도 됨" 표시를 붙여주는 리눅스 명령어
      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      # [5번] 빌드 + 테스트  (프론트의 lint + build를 합친 단계)
      # ./gradlew build 하나가 아래를 순서대로 다 해줌:
      #   ① 라이브러리 다운로드 (build.gradle 목록대로, 프론트의 npm ci 역할)
      #   ② 컴파일: .java → .class (문법 오류, 없는 클래스 참조 등 → ❌)
      #   ③ 테스트: src/test 안의 JUnit 테스트 전부 실행
      #             지금은 contextLoads 1개 = "서버가 임시 DB에 붙어서 정상적으로 켜지나?"
      #             테스트 하나라도 실패하면 → ❌
      #   ④ jar 생성: 실행 가능한 완성품 (build/libs/*.jar)
      #             지금은 만들어보고 버려짐 → 나중에 CD에서 Docker로 서버에 배포
      - name: 빌드 + 테스트
        run: ./gradlew build