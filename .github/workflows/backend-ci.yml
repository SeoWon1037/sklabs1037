# ============================================
# 백엔드 CI
# backend 폴더 코드가 바뀌면, GitHub 서버에서 자동으로 빌드 + 테스트
# ============================================

# Actions 탭에 표시될 이름
name: Backend CI

# ① 언제 실행할까? (트리거)
on:
  # main 브랜치에 push했을 때
  push:
    branches: [main]
    # 이 경로의 파일이 바뀐 경우에만 실행 (프론트만 고치면 안 돔)
    paths:
      - 'backend/**'                          # backend 폴더 안의 모든 파일
      - '.github/workflows/backend-ci.yml'    # 이 CI 파일 자체가 바뀌어도 실행
  # main으로 합쳐달라는 PR(Pull Request)을 만들었을 때도 실행
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# ② 무엇을 할까? (작업 목록)
jobs:
  # 작업 이름 (Actions 화면에 'build'로 보임)
  build:
    # GitHub이 빌려주는 새 Ubuntu 리눅스 컴퓨터에서 실행
    # 매번 아무것도 없는 깨끗한 상태로 시작함
    runs-on: ubuntu-latest

    # 아래 run 명령어들은 전부 backend 폴더 안에서 실행
    # (안 쓰면 매번 cd backend 해야 함)
    defaults:
      run:
        working-directory: backend

    # ③ 테스트에 필요한 보조 서버 띄우기
    # Spring Boot 테스트(contextLoads)가 실행될 때 DB 연결을 시도하므로
    # 운영 RDS 대신 CI 안에서만 쓰는 임시 PostgreSQL을 띄움 (끝나면 사라짐)
    services:
      postgres:
        image: postgres:16            # Docker로 PostgreSQL 16 버전 실행
        env:                          # 임시 DB 접속 정보 (테스트용이라 공개돼도 무방)
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sklabs_test    # 테스트용 DB 이름
        ports:
          - 5432:5432                 # localhost:5432로 접속 가능하게 연결
        # DB가 완전히 켜질 때까지 기다리는 설정
        # (10초마다 pg_isready로 확인, 최대 5번 재시도)
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # ④ 환경변수 설정
    # application.properties의 ${DB_URL} 등에 들어갈 값
    # 로컬에선 IntelliJ 실행 설정, CI에선 여기서 넣어줌 → 코드는 그대로!
    env:
      DB_URL: jdbc:postgresql://localhost:5432/sklabs_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    # ⑤ 실행 단계 (위에서부터 순서대로, 하나라도 실패하면 즉시 중단 → ❌)
    steps:
      # 1단계: GitHub 저장소 코드를 이 컴퓨터로 받아옴 (git clone과 같음)
      - name: 코드 받아오기
        uses: actions/checkout@v4     # uses = 남이 만들어둔 기능 가져다 쓰기

      # 2단계: Java 설치 (새 컴퓨터라 Java가 없음)
      - name: JDK 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin       # JDK 배포판 종류 (가장 많이 쓰는 무료 버전)
          java-version: '17'          # build.gradle의 JavaLanguageVersion.of(17)과 일치

      # 3단계: Gradle 준비 + 캐시
      # 다운받은 라이브러리를 저장해뒀다가 다음 실행 때 재사용 → 2번째부터 빨라짐
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # 4단계: gradlew 파일에 실행 권한 주기
      # Windows에서 커밋하면 리눅스용 실행 권한이 빠져서 "Permission denied" 에러가 남
      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew         # run = 터미널 명령어 직접 실행

      # 5단계: 컴파일 + 테스트 실행 (+ jar 파일 생성)
      # 컴파일 에러나 테스트 실패가 있으면 여기서 ❌
      - name: 빌드 + 테스트
        run: ./gradlew build