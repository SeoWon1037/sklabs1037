# ============================================
# CD: main 브랜치에 push하면 CI(백엔드/프론트) 통과 후 EC2 서버에 자동 배포
# 흐름: Backend CI + Frontend CI → 둘 다 성공하면 → SSH로 EC2 접속 → 최신 코드 받기 → Docker 이미지 빌드 → 컨테이너 교체
# - CI가 하나라도 실패하면 배포하지 않음 (깨진 코드가 운영 서버에 올라가는 것 방지)
# ============================================
name: Deploy

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'            # README 같은 문서만 바뀌면 배포하지 않음
  workflow_dispatch:       # Actions 화면에서 수동 실행 버튼

# 배포가 동시에 두 번 돌지 않게 (먼저 시작한 배포가 끝날 때까지 대기)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:

  # 1. 백엔드 CI (backend-ci.yml을 그대로 불러서 실행)
  backend-ci:
    uses: ./.github/workflows/backend-ci.yml
    secrets: inherit

  # 2. 프론트 CI (frontend-ci.yml을 그대로 불러서 실행)
  frontend-ci:
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit

  # 3. 배포 (위 두 CI가 모두 성공했을 때만)
  deploy:
    needs: [ backend-ci, frontend-ci ]
    runs-on: ubuntu-latest

    steps:
      - name: EC2에 접속해서 배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/sklabs1037

            # 최신 코드로 맞추기 (.env는 Git이 관리하지 않는 파일이라 그대로 유지됨)
            git fetch origin main
            git reset --hard origin/main

            # 바뀐 부분만 다시 빌드해서 컨테이너 교체
            docker compose up -d --build

            # 이전 버전 이미지 정리 (디스크 용량 확보)
            docker image prune -f

            docker compose ps