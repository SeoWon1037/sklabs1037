plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'   // 테스트 커버리지 (어느 코드가 테스트로 실행됐는지)
}

group = 'com.sklabs1037'
version = '0.0.1-SNAPSHOT'
description = 'sklabs1037'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    implementation 'org.springframework.security:spring-security-crypto'   // 비밀번호 암호화 (BCrypt)
    implementation 'org.springframework.boot:spring-boot-starter-mail'      // 메일 발송 (SMTP)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.apache.pdfbox:pdfbox:3.0.4'                         // 규제 Q&A: PDF 글자 추출
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'   // 테스트가 끝나면 커버리지 보고서
}

jacoco {
    toolVersion = '0.8.12'
}

// 커버리지 보고서: build/reports/jacoco/test/html (사람용), jacocoTestReport.xml (CI 요약용)
tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        html.required = true
    }
}
