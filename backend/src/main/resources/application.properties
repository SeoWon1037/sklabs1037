# ============================================
# ★
# 1. Spring Boot가 시작될 때 src/main/resources/application.properties 파일을 자동으로 찾음
# 2. 파일 안의 모든 spring. 으로 시작하는 설정들을 자동으로 읽음
# 3. 메모리에 로드해서 애플리케이션이 사용 (시작할 때 한 번 읽어서 RAM에 저장해두고, 필요할 때마다 꺼내 씀)
# ============================================


# ============================================
# Spring Boot 기본 설정
# ============================================
spring.application.name=sklabs1037


# ============================================
# PostgreSQL 데이터베이스 연결 설정
# ============================================
# 실제 값은 환경변수에서 가져옴 (GitHub에 비밀번호가 올라가지 않도록)
# DB 연결 URL (AWS RDS endpoint)
spring.datasource.url=${DB_URL}

# DB 사용자명
spring.datasource.username=${DB_USERNAME}

# DB 비밀번호
spring.datasource.password=${DB_PASSWORD}

# DB 드라이버 (PostgreSQL용 JDBC 드라이버)
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================
# MyBatis 설정
# ============================================
# SQL을 적어둘 XML 파일 위치 (resources/mapper 폴더 안의 모든 .xml)
mybatis.mapper-locations=classpath:mapper/**/*.xml

# DB의 ins_day ↔ Java의 insDay 처럼 이름을 자동으로 맞춰줌
mybatis.configuration.map-underscore-to-camel-case=true


# ============================================
# 로그 설정
# ============================================
# 실행되는 SQL을 콘솔에 출력 (개발할 때 확인용)
logging.level.com.sklabs1037.sklabs1037=debug


# ============================================
# 메일 발송 설정 (네이버 SMTP)
# ============================================
# ★ SMTP란?
#   메일을 "보내는" 규칙 (읽는 규칙은 IMAP/POP3)
#
# ★ 흐름 (우편 비유)
#   우리 서버 ──SMTP──→ 네이버 우체국 ──SMTP──→ 받는 사람 우체국 ──IMAP──→ 받는 사람
#   - 우리 서버는 네이버 우체국(smtp.naver.com)에 "맡기기"까지만 함
#   - 배달은 네이버가 알아서 → 받는 메일은 다음/지메일 등 아무거나 OK
#
# ★ 네이버와 주고받는 순서 (mail.debug=true로 콘솔에서 확인 가능)
#   접속 → 암호화(STARTTLS) → 로그인(AUTH) → 보내는 사람(MAIL FROM)
#   → 받는 사람(RCPT TO) → 내용(DATA) → 250 OK(성공) → 종료(QUIT)
#
# ★ 이렇게 설정한 이유
#   - 앱 비밀번호 : 외부 프로그램이 내 계정으로 로그인하니까 전용 비밀번호 사용
#                  (네이버 2단계 인증 필수, 유출되면 그 비밀번호만 삭제하면 됨)
#   - 보내는 사람  : 반드시 로그인한 네이버 주소와 같아야 함 (남 사칭/스팸 방지)
#   - 587 + TLS   : 비밀번호와 메일 내용을 암호화해서 전송
# ============================================

# 메일 서버 주소 / 포트 (587 = 보안 연결 TLS)
spring.mail.host=smtp.naver.com
spring.mail.port=587

# 네이버 계정 / 애플리케이션 비밀번호 (환경변수에서 가져옴)
# ${이름:} 처럼 끝에 ":"를 붙이면 "값이 없으면 빈칸"이라는 뜻
# → CI처럼 메일 설정이 없는 곳에서도 서버가 정상적으로 켜지게 하려고
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# SMTP 로그인 + TLS 보안 연결 사용
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 한글 메일 깨짐 방지
spring.mail.default-encoding=UTF-8

# 메일 서버 응답을 너무 오래 기다리지 않게 (5초 넘으면 실패 처리)
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 메일 서버와 주고받는 내용을 콘솔에 출력할지 (원인 찾을 때만 true)
# ※ true면 메일 주소/본문이 로그에 남으니 평소엔 false
spring.mail.properties.mail.debug=false

# ============================================
# 세션 설정 (로그인 상태 유지)
# ============================================
# 아무 요청 없이 30분 지나면 자동 로그아웃
server.servlet.session.timeout=30m

# 번호표 쿠키(JSESSIONID)를 JavaScript가 못 읽게 (해킹 스크립트가 쿠키 훔쳐가는 것 방지)
server.servlet.session.cookie.http-only=true

# 다른 사이트에서 몰래 보내는 요청에는 쿠키를 안 붙이게 (CSRF 공격 방지에 도움)
server.servlet.session.cookie.same-site=lax

# ============================================
# 네이버 로그인 (OAuth 2.0)
# ============================================
# 네이버 개발자센터 > 내 애플리케이션 > sklabs1037 에서 발급받은 값 (환경변수로)
naver.client-id=${NAVER_CLIENT_ID:}
naver.client-secret=${NAVER_CLIENT_SECRET:}

# 네이버 로그인 후 돌아올 주소 (네이버 개발자센터에 등록한 Callback URL과 정확히 같아야 함)
# 개발: http://localhost:5173/api/oauth/naver/callback
# 운영: https://www.sklabs1037.com/api/oauth/naver/callback (배포 때 환경변수만 바꾸면 됨)
naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:5173/api/oauth/naver/callback}

# ============================================
# 프론트엔드 주소
# ============================================
# 소셜 로그인 끝나고 사용자를 돌려보낼 화면 주소
# 개발: http://localhost:5173 / 운영: https://www.sklabs1037.com
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ============================================
# 카카오 로그인 (OAuth 2.0)
# ============================================
# 카카오 개발자센터 > 앱 > 플랫폼 키 > REST API 키 / 클라이언트 시크릿 (환경변수로)
kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}

# 카카오 로그인 후 돌아올 주소 (카카오 개발자센터에 등록한 리다이렉트 URI와 정확히 같아야 함)
# 운영: https://www.sklabs1037.com/api/oauth/kakao/callback (배포 때 환경변수만 바꾸면 됨)
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:5173/api/oauth/kakao/callback}

# ============================================
# 토스증권 Open API (시세 데이터)
# ============================================
# 실제 값은 환경변수에서 (값이 없어도 서버는 켜지게 ":" 붙임 → CI 대비)
toss.base-url=https://openapi.tossinvest.com
toss.client-id=${TOSS_CLIENT_ID:}
toss.client-secret=${TOSS_CLIENT_SECRET:}

# ============================================
# 시세 수집 스케줄러 (데이터 파이프라인)
# ============================================
# 평일 20:30 (한국 시간)에 실행 — 장 마감(애프터마켓 포함) 이후
# 형식: 초 분 시 일 월 요일
stock.collect.cron=0 30 20 * * MON-FRI

# 매일 실행할 때 받아올 최근 일수 (겹치는 날짜는 UPSERT로 덮어씀)
stock.collect.daily-count=5

# 앱이 켜질 때 시세 테이블이 비어 있으면 받아올 일수 (초기 적재, 최대 200)
stock.collect.initial-count=100

# ============================================
# Claude API (AI 주식 비서)
# ============================================
# Claude Console에서 발급한 API 키 (환경변수로)
anthropic.api-key=${ANTHROPIC_API_KEY:}

# 사용할 모델 (가장 빠르고 저렴한 Haiku)
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-5-5}

# 답변 최대 길이 (토큰) — 비용 보호
anthropic.max-tokens=2048

# ============================================
# 뉴스 수집 (Google News RSS)
# ============================================
# 30분마다 실행 (형식: 초 분 시 일 월 요일)
news.collect.cron=0 */30 * * * *

# 검색어 하나당 저장할 최신 기사 수
news.collect.max-per-query=30