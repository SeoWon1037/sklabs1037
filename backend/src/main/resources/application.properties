# ============================================
# Spring Boot 기본 설정
# ============================================
spring.application.name=sklabs1037

# ============================================
# PostgreSQL 데이터베이스 연결 설정
# - 실제 값은 코드에 쓰지 않고 "환경변수"에서 읽어옴
# - ${이름} : 실행 시 해당 환경변수 값으로 치환됨
# - 로컬: IntelliJ 실행 설정 / 운영: 서버 환경변수, GitHub Secrets
# ============================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA / Hibernate 설정
# ============================================
# update: 엔티티 변경 시 테이블 자동 수정 (운영에서는 validate 또는 none 권장)
spring.jpa.hibernate.ddl-auto=update

# 실행되는 SQL 로그 출력 (개발용)
spring.jpa.show-sql=true

# DB 커넥션을 요청 처리 중에만 사용 (실무 권장 설정)
spring.jpa.open-in-view=false