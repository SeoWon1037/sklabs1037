# ============================================
# nginx 설정 (HTTPS)
# - 개발할 때 Vite proxy가 하던 일(/api → 백엔드)을 배포에서 대신함
# - http(80)로 들어오면 전부 https://sklabs1037.com 으로 보냄
# - www.sklabs1037.com 도 https://sklabs1037.com 으로 통일
#   (주소가 하나여야 로그인 세션·소셜 로그인 콜백이 꼬이지 않음)
# - 인증서: Let's Encrypt (EC2의 /etc/letsencrypt 를 컨테이너에 읽기 전용으로 연결)
# ============================================

# ===== 80: http → https 로 이동 =====
# IP(52.62.97.114)로 들어와도 도메인 https 로 보냄
server {
    listen 80 default_server;
    server_name _;

    return 301 https://sklabs1037.com$request_uri;
}

# ===== 443: www → 도메인 하나로 통일 =====
server {
    listen 443 ssl;
    http2 on;
    server_name www.sklabs1037.com;

    ssl_certificate     /etc/letsencrypt/live/sklabs1037.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sklabs1037.com/privkey.pem;

    return 301 https://sklabs1037.com$request_uri;
}

# ===== 443: 실제 사이트 =====
server {
    listen 443 ssl;
    http2 on;
    server_name sklabs1037.com;

    # 인증서
    ssl_certificate     /etc/letsencrypt/live/sklabs1037.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sklabs1037.com/privkey.pem;

    # 안전한 버전만 허용
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /usr/share/nginx/html;
    index index.html;

    # 실시간 토론방 (SSE) → 응답을 모으지 않고 바로바로 화면에 전달
    # - proxy_buffering off: 백엔드가 한 줄 보내면 즉시 브라우저로 (켜져 있으면 모였다가 한꺼번에 가서 실시간이 아님)
    # - proxy_read_timeout 1h: 서버가 25초마다 ping을 보내지만 넉넉하게 (기본 60초면 조용할 때 끊김)
    # - HTTP/1.1 + Connection 비우기: 연결을 계속 열어둠
    location /api/stock/board/stream {

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    # /api 로 시작하는 요청 → 백엔드 컨테이너로 전달
    location /api/ {

        # 요청 본문 최대 크기 (기본 1MB → 뷰티 랩 사진·규제 문서 PDF 업로드용으로 21MB)
        client_max_body_size 21m;

        # 백엔드 주소를 매번 새로 찾기 (Docker 내부 DNS, 10초 캐시)
        # → 배포로 백엔드 컨테이너가 새로 만들어져 IP가 바뀌어도 502가 나지 않음
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;

        # 원래 요청 정보 전달 (접속한 주소, 사용자 IP, https 로 들어왔다는 것)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 답변은 도구를 여러 번 쓰면 오래 걸릴 수 있어서 넉넉하게
        proxy_read_timeout 90s;
    }

    # 빌드 파일(/assets/이름-해시.js)은 이름이 바뀌니까 오래 저장해도 됨
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 나머지 → React 화면
    # /login, /ai 같은 주소로 바로 들어와도 index.html을 주고 React가 화면을 고름
    # - index.html은 브라우저가 저장해두지 않게 (배포해도 예전 화면이 보이는 문제 방지)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}