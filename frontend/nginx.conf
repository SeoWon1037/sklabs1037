# ============================================
# nginx 설정
# - 개발할 때 Vite proxy가 하던 일(/api → 백엔드)을 배포에서 대신함
# ============================================
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # /api 로 시작하는 요청 → 백엔드 컨테이너로 전달
    # (backend = docker-compose.yml의 서비스 이름)
    location /api/ {
        proxy_pass http://backend:8080;

        # 원래 요청 정보 전달 (접속한 주소, 사용자 IP)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 답변은 도구를 여러 번 쓰면 오래 걸릴 수 있어서 넉넉하게
        proxy_read_timeout 90s;
    }

    # 나머지 → React 화면
    # /login, /ai 같은 주소로 바로 들어와도 index.html을 주고 React가 화면을 고름
    location / {
        try_files $uri $uri/ /index.html;
    }
}